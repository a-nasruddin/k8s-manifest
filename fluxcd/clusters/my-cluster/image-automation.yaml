apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: portfolio-img
  namespace: flux-system
spec:
  image: ghcr.io/a-nasruddin/portfolio
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: portfolio-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: portfolio-img
  policy:
    alphabetical:
      order: desc  # This will pick the latest tag alphabetically
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: flux-system-automation
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
  update:
    path: ./portfolio  # Flux will search in the 'portfolio' folder
    strategy: Setters
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: mcp-server-img
  namespace: flux-system
spec:
  image: ghcr.io/a-nasruddin/mcp-server
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: mcp-server-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mcp-server-img
  policy:
    alphabetical:
      order: desc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: flux-system-automation-mcp-server
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
  update:
    path: ./mcp-server  # Flux will search in the 'mcp-server' folder
    strategy: Setters
