apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.*"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  # ──────────────────────────────────────────────
  # Helm Values — optimized for k3d
  # ──────────────────────────────────────────────
  values:
    # ── Global ──
    fullnameOverride: prometheus

    # ── Disable Admission Webhooks (not needed for k3d) ──
    prometheusOperator:
      tls:
        enabled: false
      admissionWebhooks:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # ── Prometheus ──
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 7d
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Scrape all ServiceMonitors across all namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        # Storage — use emptyDir for k3d (no PV needed)
        storageSpec: {}

    # ── Grafana ──
    grafana:
      enabled: true
      adminUser: admin
      adminPassword: admin    # Change this!
      service:
        type: NodePort
        nodePort: 30030       # Access via http://localhost:30030
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # Auto-discover dashboards from ConfigMaps with the label
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"
      # Default datasource is Prometheus (auto-configured)

    # ── Alertmanager ──
    alertmanager:
      enabled: true
      # Configure Slack receiver to use Discord webhooks
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
          receiver: 'discord-webhook'
          routes:
            - matchers:
                - severity=~"critical|warning"
              receiver: 'discord-webhook'
        receivers:
          - name: 'discord-webhook'
            slack_configs:
              # IMPORTANT: Replace this URL with your Discord Webhook (ensure it ends in /slack)
              - api_url: "https://discordapp.com/api/webhooks/1492559510852600029/Gh8Eky_Fd-GBjt1Ms9PT-VRr0c0wrfD6Plz1A-fIRsRRB2d1-3BmPdxb0pqwEGsOS8SR/slack"
                send_resolved: true
                title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.SortedPairs.Values | join " " }} {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }}'
                text: >-
                  {{ range .Alerts -}}
                  *Alert:* {{ .Annotations.summary }}
                  *Description:* {{ .Annotations.description }}
                  *Severity:* `{{ .Labels.severity }}`
                  *Namespace:* `{{ .Labels.namespace }}`
                  ---
                  {{ end }}
      alertmanagerSpec:
        replicas: 1
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

    # ── Node Exporter (host-level metrics: CPU, memory, disk, network) ──
    nodeExporter:
      enabled: true

    # ── Kube State Metrics (K8s object metrics: pods, deployments, etc.) ──
    kubeStateMetrics:
      enabled: true

    # ── Default Recording & Alerting Rules ──
    defaultRules:
      create: true
      rules:
        alertmanager: true
        configReloaders: true
        general: true
        k8sContainerCpuUsageSecondsTotal: true
        k8sContainerMemoryWorkingSetBytes: true
        kubeApiserverAvailability: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        node: true
