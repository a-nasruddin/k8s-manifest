apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "5.41.4"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: logging
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 384Mi
      persistence:
        enabled: false # Using ephemeral storage for local cluster
    read: { replicas: 0 }
    write: { replicas: 0 }
    backend: { replicas: 0 }
    test: { enabled: false }
    monitoring:
      dashboards: { enabled: false }
      rules: { enabled: false }
      serviceMonitor: { enabled: false }
      selfMonitoring:
        enabled: false
        grafanaAgent: { installOperator: false }
