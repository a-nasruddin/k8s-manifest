---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  type: ClusterIP
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
  selector:
    app: logstash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      initContainers:
        # Copy the default config and overwrite with our custom one
        - name: setup-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /configmap/logstash.yml /config/logstash.yml
              cp /configmap/pipeline.conf /pipeline/pipeline.conf
          volumeMounts:
            - name: configmap
              mountPath: /configmap
              readOnly: true
            - name: config-writable
              mountPath: /config
            - name: pipeline-writable
              mountPath: /pipeline
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.17.0
          ports:
            - containerPort: 5044
              name: beats
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms128m -Xmx128m"
            - name: XPACK_MONITORING_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: config-writable
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: pipeline-writable
              mountPath: /usr/share/logstash/pipeline/pipeline.conf
              subPath: pipeline.conf
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: configmap
          configMap:
            name: logstash-config
        - name: config-writable
          emptyDir: {}
        - name: pipeline-writable
          emptyDir: {}
