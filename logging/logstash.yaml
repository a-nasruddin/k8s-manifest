---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  type: ClusterIP
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
  selector:
    app: logstash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.17.0
          ports:
            - containerPort: 5044
              name: beats
          env:
            # Settings via env vars instead of logstash.yml
            - name: LS_JAVA_OPTS
              value: "-Xms128m -Xmx128m"
            - name: XPACK_MONITORING_ENABLED
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: PIPELINE_WORKERS
              value: "1"
            - name: PIPELINE_BATCH_SIZE
              value: "125"
            - name: PATH_CONFIG
              value: "/usr/share/logstash/pipeline"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
