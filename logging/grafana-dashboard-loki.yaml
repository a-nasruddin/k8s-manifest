apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-loki
  namespace: logging
  labels:
    grafana_dashboard: "1" # This label triggers Grafana to auto-import it!
data:
  loki-logs.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "Log Volume Over Time",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate({namespace=\"$Namespace\", pod=~\"$Pod\"}[1m]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "gradientMode": "none",
                "lineWidth": 1
              }
            }
          }
        },
        {
          "title": "Raw Application Logs",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "{namespace=\"$Namespace\", pod=~\"$Pod\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["logging", "loki"],
      "templating": {
        "list": [
          {
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "Namespace",
            "options": [],
            "query": "label_values(namespace)",
            "refresh": 1,
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" }
          },
          {
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "Pod",
            "options": [],
            "query": "label_values({namespace=\"$Namespace\"}, pod)",
            "refresh": 1,
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Portfolio — Centralized Logs (Loki)",
      "uid": "loki-logs-portfolio",
      "version": 1
    }
